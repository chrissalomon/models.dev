# and the x-tempr-reasoning-effort response header reports "default".
base_model = "minimax/MiniMax-M2.7"
name = "MiniMax M2.7"
structured_output = true

reasoning_options = []

[cost]
input = 0.3
output = 1.2
cache_read = 0.06
