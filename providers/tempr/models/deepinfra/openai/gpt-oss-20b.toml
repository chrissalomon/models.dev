# /v1/responses: reasoning.effort = low|medium|high
base_model = "openai/gpt-oss-20b"

reasoning_options = [
  { type = "effort", values = ["low", "medium", "high"] },
]

[cost]
input = 0.03
output = 0.14

[limit]
context = 131_072
output = 16_384
