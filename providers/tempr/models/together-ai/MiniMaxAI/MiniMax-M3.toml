# Tempr Gateway: https://temprhq.io/docs/gateway-chat-completions#reasoning
# No reasoning control for this model on this host: it reasons at its own depth,
# and the x-tempr-reasoning-effort response header reports "default".
base_model = "minimax/MiniMax-M3"
release_date = "2026-06-12"
last_updated = "2026-06-12"
structured_output = true

reasoning_options = []

[cost]
input = 0.30
cache_read = 0.06
output = 1.20

[limit]
context = 524_288
output = 250_000

[modalities]
input = ["text", "image"]
output = ["text"]
